services:
  - type: web
    name: gymtech-api
    env: node
    region: oregon
    plan: free
    rootDir: apps/api
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gymtech-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TZ
        value: America/Sao_Paulo
      - key: CORS_ORIGIN
        value: https://web-mauve-nine-74.vercel.app
      - key: NODE_ENV
        value: production

databases:
  - name: gymtech-db
    plan: free
    region: oregon
